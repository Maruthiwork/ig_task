name: Build and Deploy CMS to MIG

on:
  push:
    branches:
      - maruthi-prelive

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: maruti-project-454712 
      REGION: asia-south1
      REPO_NAME: ig-task
      IMAGE_NAME: sample_image
      MIG_NAME: instance-group-1
      HOST_PROJECT: maruti-project-454712
      NETWORK_NAME: my-vpc
      SUBNET_NAME: subnet-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY_JSON }}'

      - name: Set up Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Push Docker Image to Artifact Registry
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$TIMESTAMP"
          TEMPLATE_NAME="sample-${TIMESTAMP}"

          echo "Building Docker image..."
          docker build -t $IMAGE_URI .

          echo "Pushing Docker image to Artifact Registry..."
          docker push $IMAGE_URI

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "TEMPLATE_NAME=$TEMPLATE_NAME" >> $GITHUB_ENV

      - name: Create instance template with Ubuntu + Docker + your container
        run: |
          echo "Creating instance template with Ubuntu base: $TEMPLATE_NAME"

          gcloud compute instance-templates create $TEMPLATE_NAME \
            --project=${{ env.PROJECT_ID }} \
            --machine-type=e2-micro \
            --boot-disk-size=10GB \
            --boot-disk-type=pd-balanced \
            --image-family=ubuntu-2204-lts \
            --image-project=ubuntu-os-cloud \
            --network=projects/${{ env.HOST_PROJECT }}/global/networks/${{ env.NETWORK_NAME }} \
            --subnet=projects/${{ env.HOST_PROJECT }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }} \
            --tags=http-server,https-server \
            --metadata=startup-script='#! /bin/bash
              apt-get update
              apt-get install -y docker.io
              systemctl start docker
              docker run -d --restart=always -p 80:80 -p 443:443 '"$IMAGE_URI"'' \
            --labels=app=sample

      - name: Rolling update on regional MIG
        run: |
          echo "Starting rolling update on MIG: ${{ env.MIG_NAME }} using template: $TEMPLATE_NAME"

          gcloud compute instance-groups managed rolling-action start-update ${{ env.MIG_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --version template=$TEMPLATE_NAME \
            --max-surge=3 \
            --max-unavailable=0
