# This file defines the steps for Cloud Build to build your Docker image
# and deploy it to Google App Engine Flexible Environment.
# Learn more: https://cloud.cloud.google.com/cloud-build/docs/deploying-applications/deploy-app-engine
# Learn more about using service accounts: https://cloud.google.com/cloud-build/docs/securing-builds/use-service-accounts

steps:
# Step 1: Build the Docker image.
# This step uses the 'docker' builder to build the image based on your Dockerfile.
# The image is tagged with the project ID and a service name.
# Replace 'my-node-app' with a descriptive name for your service if needed.
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/maruti-project-454712/my-node-app', '.']
  # The '.' indicates that the Dockerfile is in the current directory.

# Step 2: Push the Docker image to Google Container Registry (GCR) or Artifact Registry.
# This step pushes the built image so App Engine can access it.
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/maruti-project-454712/my-node-app']

# Step 3: Deploy the application to Google App Engine Flexible Environment.
# This step uses the 'gcloud' builder to deploy the application.
# It uses the app.yaml file and the Docker image built in the previous steps.
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['app', 'deploy', '.', '--promote', '--verbosity=info']
  # The '.' indicates that the app.yaml file is in the current directory.
  # '--promote' sends 100% of traffic to the new version after successful deployment.
  # Use '--no-promote' if you want to manually split traffic later.
  # '--verbosity=info' provides detailed output during deployment.

# Specifies the Docker image that will be pushed to GCR/Artifact Registry.
images:
  - 'gcr.io/$PROJECT_ID/my-node-app'

# Options for the build.
options:
  # Explicitly setting logging to CLOUD_LOGGING_ONLY sends build logs to Cloud Logging.
  logging: CLOUD_LOGGING_ONLY
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

# Specify the custom service account to use for this build.
# This field should be at the top level, not under 'options'.
# Replace [SERVICE_ACCOUNT_EMAIL] with the email address of the service account you created.
serviceAccount: 'projects/maruti-project-454712/serviceAccounts/[maruti-project-454712@appspot.gserviceaccount.com]'
# Note: You can use $PROJECT_ID instead of $PROJECT_NUMBER here as well.
