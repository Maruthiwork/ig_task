options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET  # Let Cloud Build handle the log bucket
  # Added logging option to prevent storing build logs and address the error
  logging: NONE # Do not store build logs

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/maruti-project-454712/my-app', '.']

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/maruti-project-454712/my-app']

  # Step 3: Deploy the Docker image to the GCP VM using SSH
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - '--project'
      - 'maruti-project-454712'  # Your Google Cloud project ID
      - '--zone'
      - 'asia-south1-b'  # Your VM zone
      - '--command'
      - |
          # Pull the Docker image from GCR
          docker pull gcr.io/maruti-project-454712/my-app

          # Stop and remove any existing container with the same name
          docker stop my-app || true
          docker rm my-app || true

          # Run the new Docker container
          docker run -d -p 80:80 --name my-app gcr.io/maruti-project-454712/my-app

images:
  - 'gcr.io/maruti-project-454712/my-app'  # The image to be pushed to GCR
