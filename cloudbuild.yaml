options:
  logs_bucket: gs://cloud-build-maruthi  # Replace with your bucket name

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/maruti-project-454712/my-app', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/maruti-project-454712/my-app']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - '--project'
      - 'maruti-project-454712'
      - '--zone'
      - 'asia-south1-b'
      - '--command'
      - |
          docker pull gcr.io/maruti-project-454712/my-app
          docker stop my-app || true
          docker rm my-app || true
          docker run -d -p 80:80 --name my-app gcr.io/maruti-project-454712/my-app

images:
  - 'gcr.io/maruti-project-454712/my-app'
