steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/maruti-project-454712/my-app', '.']
  
  # Step 2: Push the Docker image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/maruti-project-454712/my-app']

  # Step 3: Deploy the Docker image to your GCP VM (brotli-instance) via SSH
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - '--project'
      - 'maruti-project-454712'
      - '--zone'
      - 'asia-south1-b'  # Your instance zone
      - '--command'
      - |
          # Pull the Docker image from GCR
          docker pull gcr.io/maruti-project-454712/my-app
          
          # Stop and remove any existing container with the same name
          docker stop my-app || true
          docker rm my-app || true
          
          # Run the new Docker container
          docker run -d -p 80:80 --name my-app gcr.io/maruti-project-454712/my-app
          
images:
  - 'gcr.io/maruti-project-454712/my-app'
