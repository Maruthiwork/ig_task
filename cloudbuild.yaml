# [START cloudbuild_yaml]
# This file defines the steps for Cloud Build to build your Docker image
# and deploy it to Google App Engine Flexible Environment.
# Learn more: https://cloud.google.com/cloud-build/docs/deploying-applications/deploy-app-engine

steps:
# Step 1: Build the Docker image.
# This step uses the 'docker' builder to build the image based on your Dockerfile.
# The image is tagged with the project ID and a service name.
# Replace 'my-node-app' with a descriptive name for your service if needed.
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/my-node-app', '.']
  # The '.' indicates that the Dockerfile is in the current directory.

# Step 2: Push the Docker image to Google Container Registry (GCR).
# This step pushes the built image to GCR so App Engine can access it.
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/my-node-app']

# Step 3: Deploy the application to Google App Engine Flexible Environment.
# This step uses the 'gcloud' builder to deploy the application.
# It uses the app.yaml file and the Docker image built in the previous steps.
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['app', 'deploy', '.', '--promote', '--verbosity=info']
  # The '.' indicates that the app.yaml file is in the current directory.
  # '--promote' sends 100% of traffic to the new version after successful deployment.
  # Use '--no-promote' if you want to manually split traffic later.
  # '--verbosity=info' provides detailed output during deployment.

# Specifies the Docker image that will be pushed to GCR.
images:
  - 'gcr.io/$PROJECT_ID/my-node-app'

# Options for the build.
# logging: CLOUD_LOGGING_ONLY is the default and sends logs to Cloud Logging.
# Omit this option or set it to CLOUD_LOGGING_ONLY if you want build logs.
# If you truly want NO logs anywhere, set logging: NONE (not recommended for debugging).
options:
  # Explicitly setting logging to CLOUD_LOGGING_ONLY to satisfy the requirement
  # when a service account is involved. This sends build logs to Cloud Logging.
  logging: CLOUD_LOGGING_ONLY
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET # Keeping this as it was in your previous config

# [END cloudbuild_yaml]
