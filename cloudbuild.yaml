steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'gcr.io/$PROJECT_ID/public-api',
        '.'
      ]

  # Step 2: Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      [
        'push',
        'gcr.io/$PROJECT_ID/public-api'
      ]

  # Step 3: Deploy the image to App Engine using app.yaml
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'app', 'deploy',
        '--image-url', 'gcr.io/$PROJECT_ID/public-api',
        '--quiet'
      ]

images:
  - 'gcr.io/$PROJECT_ID/public-api'

options:
  logging: CLOUD_LOGGING_ONLY

